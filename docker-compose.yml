
services:
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://finflow-postgres:5432/finance_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1111"
      SPRING_DATA_REDIS_HOST: finflow-redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8443
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /app/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: changeit
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: finflow
    ports:
      - "8445:8443"
    networks:
      - default
      - existing_finance_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    image: postgres:18
    environment:
      PGPASSWORD: "1111"
    volumes:
      - backups:/backups
    networks:
      - existing_finance_network
    command: >-
      sh -c 'while true; do pg_dump -h finflow-postgres -U postgres -d finance_db -Fc -f /backups/finance_db_$$(date +%Y%m%d_%H%M%S).dump; find /backups -type f -mtime +7 -delete; sleep 86400; done'
    restart: unless-stopped

volumes:
  backups:

networks:
  default:
  existing_finance_network:
    external: true
    name: finance-system-final-styled-updated_default
