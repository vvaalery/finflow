syntax = "proto3";

package finflow.company;

option java_multiple_files = true;
option java_package = "com.finance.company.grpc";
option java_outer_classname = "CompanyServiceProto";

service CompanyService {
  rpc GetCompany (GetCompanyRequest) returns (GetCompanyResponse);
  rpc GetAccount (GetAccountRequest) returns (GetAccountResponse);
  rpc SaveCompany (SaveCompanyRequest) returns (CompanyData);
  rpc DeleteCompany (DeleteRequest) returns (DeleteResponse);
  rpc SaveAccount (SaveAccountRequest) returns (AccountData);
  rpc DeleteAccount (DeleteRequest) returns (DeleteResponse);
  rpc ValidateAccountOwnership (AccountOwnershipRequest) returns (AccountOwnershipResponse);
  rpc ChangeBalance (ChangeBalanceRequest) returns (ChangeBalanceResponse);
  rpc GetForecastInput (ForecastInputRequest) returns (ForecastInputResponse);
  rpc CheckProjectedBalance (ProjectedBalanceRequest) returns (ProjectedBalanceResponse);
}

message CompanyData {
  string id = 1;
  string name = 2;
  string tax_id = 3;
  string address = 4;
  string phone = 5;
  string owner_id = 6;
  string description = 7;
  string website_url = 8;
  string logo_url = 9;
  string status = 10;
}

message AccountData {
  string id = 1;
  string company_id = 2;
  string account_name = 3;
  string account_type = 4;
  string currency = 5;
  string balance = 6;
  bool is_active = 7;
}

message GetCompanyRequest { string company_id = 1; }
message GetCompanyResponse { bool found = 1; CompanyData company = 2; }

message GetAccountRequest { string account_id = 1; }
message GetAccountResponse { bool found = 1; AccountData account = 2; }

message SaveCompanyRequest { CompanyData company = 1; }
message SaveAccountRequest { AccountData account = 1; }

message DeleteRequest { string id = 1; }
message DeleteResponse { bool deleted = 1; }

message AccountOwnershipRequest {
  string account_id = 1;
  string company_id = 2;
}

message AccountOwnershipResponse {
  bool account_exists = 1;
  bool belongs_to_company = 2;
  string message = 3;
}

message ChangeBalanceRequest {
  string operation_id = 1;
  string account_id = 2;
  string delta = 3;
}

message ChangeBalanceResponse { string balance = 1; }

message ForecastInputRequest { string company_id = 1; }

message ForecastInputResponse {
  string base_currency_balance = 1;
  repeated AccountData accounts = 2;
}

message ProjectedBalanceRequest {
  string company_id = 1;
  string account_id = 2;
  string amount = 3;
  string committed_outflows = 4;
  string projected_net_flow = 5;
}

message ProjectedBalanceResponse {
  bool sufficient = 1;
  string account_balance = 2;
  string projected_balance = 3;
  string message = 4;
}
