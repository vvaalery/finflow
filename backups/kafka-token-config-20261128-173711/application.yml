spring:
  application:
    name: forecast-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forecast_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1111}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: finflow-forecast-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all

server:
  port: ${SERVER_PORT:8082}

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"

services:
  finance-url: ${FINANCE_SERVICE_URL:http://localhost:8080}
  connect-timeout-ms: ${FINANCE_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${FINANCE_READ_TIMEOUT_MS:10000}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}

company-service:
  host: ${COMPANY_SERVICE_HOST:company-service}
  port: ${COMPANY_SERVICE_PORT:9090}
  timeout-ms: ${COMPANY_SERVICE_TIMEOUT_MS:2000}
  max-attempts: ${COMPANY_SERVICE_MAX_ATTEMPTS:3}

app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
